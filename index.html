<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de regalos · Alberto · Navidad 2026</title>
<meta name="description" content="Ideas de regalo para Navidad 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ee;--ink:#151515;--muted:#9a978e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:40px 28px 64px;display:flex;flex-direction:column;gap:44px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:15px}
.pill{border:1.5px solid var(--ink);padding:7px 18px;border-radius:999px;font-weight:600}
h1{font-size:clamp(48px,10vw,120px);line-height:.92;font-weight:800;letter-spacing:-.035em;max-width:900px}
h1 span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.cell{display:flex;flex-direction:column;gap:8px}
.card{display:flex;flex-direction:column;background:#fff;border:2px solid var(--ink);border-radius:24px;padding:14px;gap:14px;color:inherit;text-decoration:none;transition:transform .15s}
a.card:hover{transform:translateY(-4px)}
.photo{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800;color:rgba(0,0,0,.18)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.photo img.alt{opacity:0}
.card:hover .photo img.alt{opacity:1}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 6px 6px}
.n{font-size:22px;font-weight:600;line-height:1.1}
.p{font-size:18px;font-weight:800;white-space:nowrap;display:flex;gap:8px;align-items:baseline}
.old{font-weight:400;font-size:15px;color:var(--muted)}
.note{font-size:14px;color:#6b6860;padding:0 6px 6px;margin-top:-8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--ink);border-radius:999px;padding:7px 18px;font-weight:600;color:inherit;text-decoration:none}
.tab.on{background:var(--ink);color:var(--bg)}
.empty{font-size:20px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* modo editar */
#admin{display:none;background:#fff;border:2px solid var(--ink);border-radius:24px;padding:22px;flex-direction:column;gap:14px}
.edit #admin{display:flex}
#admin h2{font-size:22px}
#admin p,#admin li{font-size:14px;color:#55524a}
#admin ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
input{font:inherit;font-size:15px;border:1.5px solid var(--ink);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6b6860}
button{font:inherit;font-weight:600;font-size:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
button:disabled{opacity:.5;cursor:wait}
.adm{display:none;gap:8px}
.edit .adm{display:flex}
.adm button{padding:6px 12px;font-size:13px}
#status{font-size:14px;min-height:20px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top"><span class="pill" id="year"></span><span><span id="owner"></span><button id="addBtn" style="margin-left:14px">+ Añadir</button></span></div>
  <nav class="tabs" id="tabs"></nav>
  <h1 id="h1"></h1>

  <section id="admin">
    <h2 id="adminTitle">Modo editar</h2>
    <div id="form">
      <label>Pega el enlace del producto
        <div class="row"><input id="fl" type="url" placeholder="https://…"><button id="find">Añadir</button></div>
      </label>
      <p>O rellena los datos a mano:</p>
      <div class="row">
        <label>Nombre<input id="fn"></label>
        <label>Precio (€)<input id="fp" inputmode="decimal"></label>
        <label>Precio original (€)<input id="fo" inputmode="decimal" placeholder="si está de oferta"></label>
      </div>
      <div class="row">
        <label>Foto (enlace o ruta)<input id="fi"></label>
        <label>…o súbela<input id="ff" type="file" accept="image/*"></label>
        <label>Segunda foto (enlace o ruta)<input id="fi2"></label>
        <label>…o súbela<input id="ff2" type="file" accept="image/*"></label>
      </div>
      <div class="row" style="flex-wrap:nowrap">
        <button id="save">Añadir a la lista</button>
        <button id="cancel" class="alt hide">Cancelar edición</button>
      </div>
    </div>
    <div id="status"></div>
  </section>

  <main class="grid" id="grid"></main>
  <footer><span>Lista de deseos</span><span>cameno</span></footer>
</div>

<script>

var LISTS=[{id:'alberto',name:'Alberto'},{id:'elena',name:'Elena'},{id:'mama',name:'Mamá'},{id:'papa',name:'Papá'}];
function curList(){var h=(location.hash||'').replace('#','');return LISTS.filter(function(l){return l.id===h})[0]||LISTS[0]}
function FILE(){return 'listas/'+curList().id+'.json'}
var OWNER='', YEAR='Navidad 2026';
var EDIT=location.hash==='#editar';
var TINTS=['#e4e1d8','#dde3ea','#e6dccb','#dfe6dc'];
var WISHES=[],editing=-1;

var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function eur(n){return Number(n).toLocaleString('es-ES',{maximumFractionDigits:2})+' €'}
function safe(u){return /^https?:\/\//i.test(u||'')?u:''}
function src(u){return /^https?:\/\//i.test(u||'')||/^[\w./-]+$/.test(u||'')?u:''}
function num(s){return price2num(s)}
function say(m){$('status').textContent=m||''}

/* ---------- servidor ---------- */
var API='/.netlify/functions/lista';
async function api(body){
  var r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
  catch(e){throw new Error('sin conexión')}
  var j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||('error '+r.status));
  return j;
}
async function load(){
  try{var r=await fetch(API+'?lista='+curList().id+'&t='+Date.now(),{cache:'no-store'});if(r.ok){WISHES=await r.json();return}}catch(e){}
  try{var r2=await fetch(FILE()+'?t='+Date.now(),{cache:'no-store'});WISHES=await r2.json()}
  catch(e){WISHES=[];say('No se pudo cargar la lista.')}
}

/* ---------- pintar ---------- */
function render(){
  if(!WISHES.length){$('grid').innerHTML='<p class="empty">Todavía no hay regalos en esta lista.</p>';return}
  $('grid').innerHTML=WISHES.map(function(w,i){
    var u=safe(w.l),tag=u?'a':'div',a=src(w.img),b=src(w.img2);
    var price=(w.po&&w.p?'<s class="old">'+eur(w.po)+'</s>':'')+(w.p?'<span>'+eur(w.p)+'</span>':'');
    return '<div class="cell"><'+tag+' class="card"'+(u?' href="'+esc(u)+'" target="_blank" rel="noopener"':'')+'>'+
      '<div class="photo" style="background:'+TINTS[i%TINTS.length]+'">'+esc((w.n||'?').charAt(0).toUpperCase())+
      (a?'<img src="'+esc(a)+'" alt="'+esc(w.n)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'')+
      (b?'<img class="alt" src="'+esc(b)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">':'')+
      '</div><div class="cap"><span class="n">'+esc(w.n)+'</span><span class="p">'+price+'</span></div>'+
      (w.o?'<div class="note">'+esc(w.o)+'</div>':'')+
      '</'+tag+'><div class="adm"><button class="alt" data-a="edit" data-i="'+i+'">Editar</button><button class="alt" data-a="del" data-i="'+i+'">Eliminar</button></div></div>';
  }).join('');
}
function renderHeader(){
  var c=curList();
  $('h1').innerHTML='Lista de <span>'+esc(c.name)+'</span>';
  document.title='Lista de '+c.name+' · Navidad 2026';
  $('tabs').innerHTML=LISTS.map(function(l){return '<a class="tab'+(l.id===c.id?' on':'')+'" href="#'+l.id+'">'+esc(l.name)+'</a>'}).join('');
  $('adminTitle').textContent='Añadir a la lista de '+c.name;
}
function resetForm(){
  editing=-1;['fl','fn','fp','fo','fi','fi2'].forEach(function(i){$(i).value=''});$('ff').value='';$('ff2').value='';
  $('save').textContent='Añadir a la lista';$('cancel').classList.add('hide');
}

/* ---------- acciones del modo editar ---------- */
function wire(){
  $('find').onclick=async function(){
    var u=$('fl').value.trim();if(!safe(u)){say('Pega un enlace que empiece por https://');return}
    $('find').disabled=true;say('Enviando enlace…');
    var id=curList().id,n0=WISHES.length;
    try{await api({op:'link',lista:id,url:u})}
    catch(e){say('No se pudo enviar ('+e.message+').');$('find').disabled=false;return}
    $('fl').value='';
    say('Leyendo el producto… unos 15 segundos.');
    for(var i=0;i<60;i++){
      await new Promise(function(f){setTimeout(f,3000)});
      if(curList().id!==id)break;
      await load();
      if(WISHES.length>n0){render();say('Añadido. Si falta algo (precio o fotos), pulsa «Editar» en su tarjeta.');break}
      if(i===59)say('Aún no aparece. Recarga en un minuto o añádelo a mano.');
    }
    $('find').disabled=false;
  };
  function up(inp,dest,lbl){inp.onchange=function(){
    var f=inp.files&&this.files[0];if(!f)return;
    say('Subiendo foto…');
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        var data=c.toDataURL('image/jpeg',.85).split(',')[1];
        api({op:'photo',data:data})
          .then(function(r){$(dest).value=r.path;say(lbl+' subida.')})
          .catch(function(e){say('No se pudo subir la foto ('+e.message+').')});
      };
      im.onerror=function(){say('No se pudo leer esa imagen.')};
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };}
  up($('ff'),'fi','Foto');up($('ff2'),'fi2','Segunda foto');
  $('save').onclick=async function(){
    var n=$('fn').value.trim();if(!n){say('Pon un nombre.');return}
    var o={n:n};
    var p=num($('fp').value),po=num($('fo').value),l=$('fl').value.trim(),im=$('fi').value.trim();
    if(p!=='')o.p=p;if(po!=='')o.po=po;if(safe(l))o.l=l;if(im)o.img=im;var im2=$('fi2').value.trim();if(im2)o.img2=im2;
    var prev=editing>=0?WISHES[editing]:null;
    if(prev){if(prev.o)o.o=prev.o;}
    $('save').disabled=true;say('Guardando…');
    try{
      WISHES=editing>=0?await api({op:'update',lista:curList().id,index:editing,name:prev.n,item:o}):await api({op:'add',lista:curList().id,item:o});
      render();resetForm();say('Guardado.');
    }catch(e){say('No se pudo guardar ('+e.message+').')}
    $('save').disabled=false;
  };
  $('cancel').onclick=function(){resetForm();say('')};
  $('grid').addEventListener('click',async function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var i=+b.dataset.i,w=WISHES[i];
    if(b.dataset.a==='edit'){
      editing=i;$('fn').value=w.n||'';$('fp').value=w.p!=null?w.p:'';$('fo').value=w.po!=null?w.po:'';
      $('fl').value=w.l||'';$('fi').value=w.img||'';$('fi2').value=w.img2||'';$('save').textContent='Guardar cambios';$('cancel').classList.remove('hide');
      $('admin').scrollIntoView({behavior:'smooth'});
    }else if(b.dataset.a==='del'){
      if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿Seguro?';return}
      say('Eliminando…');
      try{WISHES=await api({op:'remove',lista:curList().id,index:i,name:w.n});render();say('Eliminado.')}
      catch(err){say('No se pudo eliminar ('+err.message+').')}
    }
  });
}

/* ---------- inicio ---------- */
$('year').textContent=YEAR;$('owner').textContent=OWNER;
wire();
if(EDIT)document.body.classList.add('edit');
$('addBtn').onclick=function(){
  document.body.classList.toggle('edit');
  if(document.body.classList.contains('edit')){setTimeout(function(){$('fl').focus()},50)}
};
$('fl').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('find').click()}});
renderHeader();
window.addEventListener('hashchange',function(){renderHeader();resetForm();say('');WISHES=[];load().then(render)});
load().then(render);
</script>
</body>
</html>
