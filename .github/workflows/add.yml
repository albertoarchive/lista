name: Añadir regalo desde enlace
on:
  push:
    branches: [main]
    paths: ['pedidos/*.json']
  workflow_dispatch:
concurrency:
  group: add-gift
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add.py
      - name: Guardar
        run: |
          git config user.name "lista-bot"
          git config user.email "lista-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Añade regalo desde enlace"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 3; done
